name: Crypto Market Pipeline

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

jobs:
  run-pipeline:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify database secrets
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
           python -c "import os; print('DATABASE_HOST:', os.getenv('DATABASE_HOST') or 'MISSING'); print('DATABASE_PORT:', os.getenv('DATABASE_PORT') or 'MISSING'); print('DATABASE_NAME:', os.getenv('DATABASE_NAME') or 'MISSING'); print('DATABASE_USER:', os.getenv('DATABASE_USER') or 'MISSING'); print('DATABASE_PASSWORD:', 'SET' if os.getenv('DATABASE_PASSWORD') else 'MISSING')"

      - name: Run crypto pipeline
        env:
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_PORT: ${{ secrets.DATABASE_PORT }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          python scripts/run_pipeline.py